services:
  firefleethq:
    build: .
    container_name: firefleethq
    ports:
      # Host port is configurable; container still listens on 8000.
      - "${HOST_PORT:-8000}:8000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      # Always use the mounted volume path. Do not inherit DATABASE_URL from host
      # .env (e.g. sqlite:///firefleethq.db), or the DB lands in /app/instance
      # inside the image and is wiped on rebuild.
      - DATABASE_URL=sqlite:////app/data/firefleethq.db
      - SOCKETIO_ASYNC_MODE=${SOCKETIO_ASYNC_MODE:-gevent}
      - SCRAPE_INTERVAL_MINUTES=${SCRAPE_INTERVAL_MINUTES:-15}
      - TZ=${TZ:-America/New_York}
      - APP_TIMEZONE=${APP_TIMEZONE:-America/New_York}
    volumes:
      - ./instance:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - firefleet-network

networks:
  firefleet-network:
    driver: bridge
